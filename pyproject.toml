[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cdy-agent"
version = "0.1.2"
description = "A small OpenAI Python SDK based personal AI agent with local skill support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "openai>=1.99.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0.0",
]

[project.scripts]
cdy-agent = "cdy_agent.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/cdy_agent"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/index.html" = "cdy_agent/frontend/index.html"
"frontend/package.json" = "cdy_agent/frontend/package.json"
"frontend/package-lock.json" = "cdy_agent/frontend/package-lock.json"
"frontend/src" = "cdy_agent/frontend/src"
"frontend/tsconfig.app.json" = "cdy_agent/frontend/tsconfig.app.json"
"frontend/tsconfig.json" = "cdy_agent/frontend/tsconfig.json"
"frontend/tsconfig.node.json" = "cdy_agent/frontend/tsconfig.node.json"
"frontend/vite.config.ts" = "cdy_agent/frontend/vite.config.ts"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/frontend",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = [
  "/frontend/node_modules",
  "/frontend/node_modules/**",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "ruff>=0.16.0",
]
